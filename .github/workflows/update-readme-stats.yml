name: Update README languages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-readme-stats.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-languages
  cancel-in-progress: true

jobs:
  update-card:
    runs-on: ubuntu-latest

    steps:
      - name: Verify README stats token
        shell: bash
        env:
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: |
          if [ -z "$README_STATS_TOKEN" ]; then
            echo "::error::Configure o secret README_STATS_TOKEN com um PAT classic usando os escopos repo e read:user."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=icarolhl&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&card_width=500&locale=pt-br&custom_title=Linguagens%20mais%20utilizadas"
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit updated card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Atualiza estatísticas do perfil"
          git push
