name: Update README stats

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-readme-stats.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Verify README stats token
        shell: bash
        env:
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: |
          if [ -z "$README_STATS_TOKEN" ]; then
            echo "::error::Configure README_STATS_TOKEN with a classic PAT using the repo and read:user scopes."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=icarolhl&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=icarolhl&layout=compact&theme=tokyonight&hide_border=true&langs_count=8"
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Atualiza estatísticas do perfil"
          git push
